[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspreadbot"
version = "0.1.0"
description = "Async cross-exchange perpetual arbitrage with Gate, Hyperliquid and Redis coordination"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0,<2.0",
    "aiohttp>=3.12,<4",
    "redis>=5,<7",
    "hyperliquid-python-sdk>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "fakeredis[lua]>=2.30,<3", "ruff>=0.12,<1"]

[project.scripts]
pyspreadbot = "pyspreadbot.main:main"

[tool.setuptools]
packages = ["pyspreadbot", "pyspreadbot.exchange"]
package-dir = {pyspreadbot = "src"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
