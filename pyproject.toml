[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspreadbot"
version = "0.1.0"
description = "PySpreadBot Python application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0,<2.0"]

[project.scripts]
pyspreadbot = "pyspreadbot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
